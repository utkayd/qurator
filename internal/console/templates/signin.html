{{define "content"}}
<div class="auth-wrap">
  <div class="auth-brand">
    <span class="wordmark wordmark-lg">qurator</span>
    <p class="help">Self-hosted QR codes</p>
  </div>
  <div class="card auth-card">
    <h1 class="card-title">Sign in</h1>
    {{if .Error}}<p class="banner banner-danger" role="alert">{{.Error}}</p>{{end}}
    <form class="stack" method="post" action="/ui/signin">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required value="{{.Email}}" autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
  </div>
</div>
{{end}}
