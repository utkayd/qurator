# Local upgrade-path stack (quickstart.md Scenario 7) and the fixtures the Docker-based
# contract test suites skip against when QURATOR_TEST_PG_DSN / QURATOR_TEST_S3_ENDPOINT
# are unset (research.md decision #10 / .github/workflows/contract-tests.yml runs the
# same two services directly as Actions `services:` instead of this file, so CI does not
# depend on Compose — this file is for a contributor's laptop).
#
# Zero-config mode needs none of this: `./bin/qurator` alone is the whole story. This
# file exists only for exercising the Postgres + S3-compatible upgrade path locally.

services:
  qurator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      QURATOR_DB_DRIVER: postgres
      QURATOR_DB_DSN: postgres://qurator:qurator@postgres:5432/qurator?sslmode=disable
      QURATOR_BLOB_DRIVER: s3
      QURATOR_BLOB_S3_ENDPOINT: minio:9000
      QURATOR_BLOB_S3_BUCKET: qurator
      QURATOR_BLOB_S3_ACCESS_KEY: qurator
      QURATOR_BLOB_S3_SECRET_KEY: qurator-dev-secret
      QURATOR_BLOB_S3_USE_SSL: "false"
      QURATOR_BLOB_S3_PATH_STYLE: "true"
      QURATOR_AUTH_DEV_MODE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: qurator
      POSTGRES_PASSWORD: qurator
      POSTGRES_DB: qurator
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qurator -d qurator"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - qurator-postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: qurator
      MINIO_ROOT_PASSWORD: qurator-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - qurator-minio-data:/data

  # `docker compose --profile contract-test up -d postgres minio contract-test-env`
  # brings up just the two dependencies plus this throwaway container, which does
  # nothing but print the env vars a contributor pastes into their shell to run the
  # full contract suite locally:
  #   QURATOR_TEST_PG_DSN=postgres://qurator:qurator@localhost:5432/qurator?sslmode=disable
  #   QURATOR_TEST_S3_ENDPOINT=localhost:9000
  contract-test-env:
    profiles: ["contract-test"]
    image: alpine:3
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      QURATOR_TEST_PG_DSN: postgres://qurator:qurator@localhost:5432/qurator?sslmode=disable
      QURATOR_TEST_S3_ENDPOINT: localhost:9000
    command:
      - sh
      - -c
      - |
        echo "export QURATOR_TEST_PG_DSN=$$QURATOR_TEST_PG_DSN"
        echo "export QURATOR_TEST_S3_ENDPOINT=$$QURATOR_TEST_S3_ENDPOINT"

volumes:
  qurator-postgres-data:
  qurator-minio-data:
