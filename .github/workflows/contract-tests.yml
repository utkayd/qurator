name: contract-tests

# Runs the Postgres/S3 contract suites that ci.yml's `test` job deliberately skips
# (research.md decision #10: `go test ./...` must stay green and Docker-free for
# contributors; this workflow is where the skipped assertions actually execute).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qurator
          POSTGRES_PASSWORD: qurator
          POSTGRES_DB: qurator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qurator -d qurator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: qurator
          MINIO_ROOT_PASSWORD: qurator-dev-secret
        ports:
          - 9000:9000
        # The published minio/minio image's default entrypoint expects the `server`
        # subcommand and args, which the `services:` block cannot pass — Actions runs
        # containers with their built-in ENTRYPOINT/CMD. minio's image runs
        # `minio server /data` as its CMD by default, so plain `docker run` (what
        # `services:` does under the hood) already starts the server; healthcheck
        # confirms it actually came up before tests depend on it.
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      QURATOR_TEST_PG_DSN: postgres://qurator:qurator@localhost:5432/qurator?sslmode=disable
      QURATOR_TEST_S3_ENDPOINT: localhost:9000
      QURATOR_TEST_S3_ACCESS_KEY: qurator
      QURATOR_TEST_S3_SECRET_KEY: qurator-dev-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Wait for MinIO bucket readiness
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/ready && break
            sleep 2
          done
      - run: go test -race ./...
