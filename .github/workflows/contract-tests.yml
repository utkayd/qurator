name: contract-tests
on:
  push:
    branches:
    - main
  pull_request: null
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qurator
          POSTGRES_PASSWORD: qurator
          POSTGRES_DB: qurator
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U qurator -d qurator" --health-interval 5s --health-timeout 5s --health-retries
          10
    env:
      QURATOR_TEST_PG_DSN: postgres://qurator:qurator@localhost:5432/qurator?sslmode=disable
      QURATOR_TEST_S3_ENDPOINT: localhost:9000
      QURATOR_TEST_S3_ACCESS_KEY: qurator
      QURATOR_TEST_S3_SECRET_KEY: qurator-dev-secret
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    # quay.io is MinIO's registry; the Docker Hub minio/minio repository no longer
    # exists. The digest is the index this workflow last pulled as minio/minio:latest.
    - name: 'Start MinIO (services: cannot pass the required `server` argument)'
      run: 'docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=qurator -e MINIO_ROOT_PASSWORD=qurator-dev-secret quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
        server /data

        for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9000/minio/health/live && break; sleep 1; done'
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
    - name: Wait for MinIO bucket readiness
      run: "for i in $(seq 1 20); do\n  curl -sf http://localhost:9000/minio/health/ready && break\n  sleep 2\ndone\n"
    - run: go test -race ./...
