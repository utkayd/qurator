name: browser
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci --prefix tests/browser
      - run: npm --prefix tests/browser exec -- playwright install --with-deps chromium
      - run: npm test --prefix tests/browser
