name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make build
      - run: file bin/qurator | grep -q "statically linked" || (file bin/qurator; exit 1)

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make fmt-check
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with: { version: latest }

  test:
    # Deliberately no service containers: this is the Docker-free baseline every
    # contributor can reproduce. Postgres/S3 suites skip here and run in contract-tests.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make test

  zero-config-isolated:
    # Constitution Principle I, made checkable: the static binary starts and serves with
    # NO environment variables and NO network. `--network none` also proves no outbound
    # call is required at startup (FR-056).
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make build
      - run: |
          docker run -d --name zc --network none -v "$PWD/bin:/b:ro" -w /tmp \
            gcr.io/distroless/static-debian13:nonroot /b/qurator
          for i in $(seq 1 20); do
            if docker exec zc /b/qurator --version >/dev/null 2>&1; then :; fi
            sleep 0.5
          done
          # distroless has no shell or curl; probe from a sidecar sharing the network namespace.
          docker run --rm --network container:zc curlimages/curl:8.5.0 -fsS http://127.0.0.1:8080/healthz
          docker run --rm --network container:zc curlimages/curl:8.5.0 -fsS http://127.0.0.1:8080/readyz
          docker logs zc
          docker rm -f zc
