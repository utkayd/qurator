name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make build
      - run: file bin/qurator | grep -q "statically linked" || (file bin/qurator; exit 1)

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make fmt-check
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with: { version: latest }

  test:
    # Deliberately no service containers: this is the Docker-free baseline every
    # contributor can reproduce. Postgres/S3 suites skip here and run in contract-tests.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make test
