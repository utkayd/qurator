name: bench

# Guards the constitutionally protected hot paths (Principle III: ephemeral render;
# Principle IV: the redirect handler and the scan recorder) against performance
# regressions. Runs this PR's benchmarks interleaved with its base's, compares with
# benchstat, fails on statistically significant regressions of 5% or more, and surfaces
# smaller significant deltas as warnings.
on:
  pull_request:

permissions:
  contents: read

jobs:
  benchstat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Checkout base ref into a sibling directory
        run: |
          git worktree add ../base-ref "origin/${{ github.event.pull_request.base.ref }}"

      # Base and head are run INTERLEAVED, one iteration each, ten times. Running all of
      # base then all of head puts any runner drift (thermal, noisy neighbour, frequency
      # scaling) entirely on one side and shows up as a 5% "regression" in untouched code.
      # Compiling the test binaries once also removes build-cache effects from the timing.
      - name: Compile benchmark binaries for base and head
        run: |
          set -e
          PKGS="internal/qr internal/analytics internal/httpapi/public"
          mkdir -p bins/base bins/head
          for pkg in $PKGS; do
            name=$(echo "$pkg" | tr '/' '_')
            go test -c -o "bins/head/$name.test" "./$pkg"
            (cd ../base-ref && go test -c -o "${GITHUB_WORKSPACE}/bins/base/$name.test" "./$pkg")
          done

      - name: Run interleaved benchmarks
        run: |
          set -e
          : > old.txt; : > new.txt
          for i in $(seq 1 10); do
            for side in base head; do
              out=old.txt; [ "$side" = head ] && out=new.txt
              for bin in bins/$side/*.test; do
                pkgdir=$(basename "$bin" .test | tr '_' '/')
                (cd "$pkgdir" 2>/dev/null || cd "../base-ref/$pkgdir"; \
                 "${GITHUB_WORKSPACE}/$bin" -test.run '^$' -test.bench 'BenchmarkRender|BenchmarkRecord$|BenchmarkRedirect' \
                   -test.count=1 -test.benchmem) >> "$out"
              done
            done
          done
          echo "--- head ---"; grep -c Benchmark new.txt; echo "--- base ---"; grep -c Benchmark old.txt

      - name: Compare with benchstat
        run: |
          benchstat old.txt new.txt | tee benchstat.txt
          echo "## Benchmark comparison (base -> PR)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat benchstat.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Gated set: Render (Principle III), Record drop path (Principle IV, 0 allocs, ±1%),
      # Redirect. BenchmarkRecordAccepted is deliberately NOT gated: its bytes/op are
      # amortised worker batch allocations and swing ±5-7% run to run, above the threshold.
      - name: Fail on significant regressions of 5% or more
        run: |
          # benchstat prints "~" when a change is not statistically significant and a
          # percentage with "(p=...)" when it is. On stable runners a 0.2% change can be
          # significant at n=10, so significance alone is not a regression: this gate fails
          # only on significant slowdowns/growth of >= 5% and warns on smaller ones.
          # geomean summary lines never carry the marker and are ignored.
          fail=0
          while IFS= read -r line; do
            pct=$(echo "$line" | grep -oE '\+[0-9]+(\.[0-9]+)?%' | head -1 | tr -d '+%')
            if [ -n "$pct" ] && awk -v p="$pct" 'BEGIN{exit !(p>=5)}'; then
              echo "::error::Regression >= 5%: $line"; fail=1
            elif [ -n "$pct" ]; then
              echo "::warning::Small significant delta (< 5%): $line"
            fi
          done < <(grep -v geomean benchstat.txt | grep -E '\+[0-9]+(\.[0-9]+)?%.*\(p=' || true)
          [ "$fail" -eq 0 ] && echo "No regression >= 5%."
          exit $fail
